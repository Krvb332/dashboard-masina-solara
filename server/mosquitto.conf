# Broker local de pitlane. Fără autentificare, pentru că rețeaua este izolată.
# Într-o rețea partajată, activează listener-ul cu parolă și TLS.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Reține ultimul mesaj pe topic, ca un client nou conectat să aibă imediat o stare.
max_queued_messages 10000
